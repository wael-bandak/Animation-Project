<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Layout</title>
<style>
  :root { --red:#8f0000; --red2:#b30000; --bg:#f3f3f3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; font-family: "Times New Roman", serif; background:#fff; overflow:hidden; }
  .app { display:grid; grid-template-rows:70px 1fr; grid-template-columns:230px 1fr; height:100vh; grid-template-areas:"top top" "side main"; }

  /* Header */
  header { grid-area:top; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 16px; box-shadow:0 2px 8px rgba(0,0,0,.35); z-index:5; }
  .brand { display:flex; align-items:center; gap:14px; font-size:22px; font-weight:bold; }
  .logo { width:34px; height:34px; background:#fff; border-radius:9px; display:grid; place-items:center; color:var(--red); font-size:18px; }
  .actions { display:flex; gap:28px; font-family:Arial, sans-serif; font-size:15px; }
  .actions button { background:none; border:0; color:#fff; cursor:pointer; font-size:15px; display:flex; align-items:center; gap:8px; font-family:inherit; }
  .actions button:hover { opacity:.8; }

  /* Sidebar */
  aside { grid-area:side; background:var(--bg); overflow-y:auto; padding-top:10px; font-family:Arial, sans-serif; border-inline-end:1px solid #ddd; }
  aside a { display:flex; align-items:center; gap:14px; padding:0 16px; height:41.5px; font-size:13px; color:#222; text-decoration:none; transition:background .2s; }
  aside a:hover { background:#e6e6e6; }
  aside a i { font-style:normal; width:20px; text-align:center; font-size:17px; font-weight:bold; }

  /* Main */
  main { grid-area:main; overflow-y:auto; position:relative; display:flex; flex-direction:column; background:#fff; }
  .hero { display:grid; grid-template-columns:55fr 45fr; height:436px; flex-shrink:0; }
  .hero-left { position:relative; overflow:hidden; display:grid; place-items:center;
    background:linear-gradient(160deg,#c20000,#8f0000,#d40000,#7a0000); background-size:300% 300%; animation:bgMove 8s ease-in-out infinite; }
  @keyframes bgMove { 0%{background-position:0% 0%} 50%{background-position:100% 100%} 100%{background-position:0% 0%} }
  .hero-left h2 { color:#fff; font-size:25px; z-index:2; text-shadow:0 2px 6px rgba(0,0,0,.4); animation:titlePulse 3s ease-in-out infinite; }
  @keyframes titlePulse { 50% { transform:scale(1.06); } }
  .shape { position:absolute; background:rgba(255,255,255,.14); border:3px solid rgba(255,255,255,.12); }
  .s1 { width:190px; height:290px; border-radius:0 90px 90px 0; left:-60px; top:60px; animation:float1 9s ease-in-out infinite; }
  .s2 { width:95px; height:95px; border-radius:26px; right:22%; top:12%; animation:float2 7s ease-in-out infinite; }
  .s3 { width:95px; height:95px; border-radius:30px 6px 30px 6px; left:12%; bottom:16%; animation:float3 8s ease-in-out infinite; }
  .s4 { width:160px; height:110px; border-radius:50px 0 0 0; right:6%; bottom:-10px; background:rgba(255,255,255,.22); animation:float4 10s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(40px,-50px) rotate(12deg)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-40px,60px) rotate(90deg)} }
  @keyframes float3 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(60px,-40px) rotate(-70deg)} }
  @keyframes float4 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px) scale(1.2)} }

  .hero-right { background:var(--bg); position:relative; overflow:hidden; }

  /* 3D heart */
  #heart3d { width:100%; height:100%; }
  #heart3d canvas { display:block; }

  /* Content */
  .content { padding:0 16px 20px; flex:1; }
  .content h1 { font-size:24px; margin:22px 0 14px; }
  .content h3 { font-size:19px; margin:16px 0 10px; }
  .content p { font-size:15px; line-height:1.5; }
  .row { display:flex; align-items:center; gap:16px; margin:8px 0 10px; font-size:14px; }
  .badge { width:82px; height:82px; border-radius:14px; display:grid; place-items:center; color:#fff; font-family:Arial,sans-serif; font-weight:bold; font-size:24px; flex-shrink:0; }
  .b-html { background:#e44d26; } .b-css { background:#264de4; } .b-js { background:#f7df1e; color:#222; }
  .new { animation:pop .5s ease; }
  @keyframes pop { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }

  footer { text-align:center; padding:14px; font-size:13px; color:#444; border-top:1px solid #ddd; background:#fff; position:sticky; bottom:0; }
  .fab { position:fixed; bottom:48px; inset-inline-end:26px; width:52px; height:52px; border-radius:50%; border:0; background:var(--red); color:#fff; font-size:30px; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.4); transition:transform .25s; z-index:6; }
  .fab:hover { transform:rotate(90deg) scale(1.1); }

  [dir=rtl] .s1 { left:auto; right:-60px; border-radius:90px 0 0 90px; }
  @media (max-width:800px){
    .app{grid-template-columns:190px 1fr}
    .hero{grid-template-columns:1fr; height:auto}
    .hero-left,.hero-right{height:260px}
    .actions{gap:16px}
    .actions button{font-size:13px}
  }
  @media (max-width:560px){
    .app{grid-template-columns:150px 1fr}
    aside a{font-size:12px; gap:8px; padding:0 10px}
    .brand{font-size:17px; gap:8px}
    .actions{gap:10px}
    .actions button{font-size:12px; gap:4px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">🎓</div><span id="brand">Training 2026</span></div>
    <div class="actions">
      <button id="langBtn">🌐 <span>العربية</span></button>
      <button id="addBtn">＋ <span id="addTxt">Add content</span></button>
      <button id="clearBtn">🗑 <span id="clearTxt">Clear content</span></button>
    </div>
  </header>

  <aside id="menu"></aside>

  <main>
    <section class="hero">
      <div class="hero-left">
        <div class="shape s1"></div><div class="shape s2"></div>
        <div class="shape s3"></div><div class="shape s4"></div>
        <h2 id="heroTitle">CSS Animation</h2>
      </div>
      <div class="hero-right">
        <div id="heart3d"></div>
      </div>
    </section>

    <div class="content" id="content"></div>
    <footer id="footer">© 2026 Training 2026. All rights reserved.</footer>
  </main>
</div>
<button class="fab" id="fab" title="Add">+</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  const box = document.getElementById("heart3d");
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0.2, 9);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.appendChild(renderer.domElement);

  // ---------- Lights (soft studio look, glossy highlights) ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0x884444, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(-4, 6, 6); scene.add(key);
  const key2 = new THREE.DirectionalLight(0xffeedd, 0.5); key2.position.set(5, 2, 5); scene.add(key2);
  const rim = new THREE.DirectionalLight(0xff9a8a, 0.7); rim.position.set(0, 3, -6); scene.add(rim);

  // ---------- Procedural muscle / fat / vein texture ----------
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function makeTexture() {
    const W = 1024, H = 512;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, "#a63a2e"); gr.addColorStop(0.5, "#8c1f1f"); gr.addColorStop(1, "#5a0c11");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // muscle fibers
    g.lineCap = "round";
    for (let i = 0; i < 9000; i++) {
      const x = rnd(0, W), y = rnd(0, H), l = rnd(10, 38), a = 0.6 + rnd(-0.3, 0.3);
      g.strokeStyle = Math.random() < 0.5 ? `rgba(255,150,120,${rnd(0.03, 0.09)})` : `rgba(30,0,0,${rnd(0.05, 0.14)})`;
      g.lineWidth = rnd(1, 3);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    // yellow fat near the top (base of the heart)
    for (let i = 0; i < 90; i++) {
      const x = rnd(0, W), y = rnd(0, 190), r = rnd(14, 46);
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, "rgba(232,184,120,0.8)"); rg.addColorStop(1, "rgba(232,184,120,0)");
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    // surface veins
    for (let k = 0; k < 18; k++) {
      let x = rnd(0, W), y = rnd(30, 300);
      g.beginPath(); g.moveTo(x, y);
      for (let j = 0; j < 14; j++) { x += rnd(-18, 22); y += rnd(10, 28); g.lineTo(x, y); }
      g.strokeStyle = "rgba(60,25,60,0.55)"; g.lineWidth = rnd(2, 4); g.stroke();
      g.strokeStyle = "rgba(220,120,110,0.18)"; g.lineWidth = 1; g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = THREE.RepeatWrapping; t.anisotropy = 8;
    return t;
  }
  const tex = makeTexture();

  // ---------- Shape ----------
  function deform(v) {
    let x = v.x, y = v.y, z = v.z;
    const groove = z > 0 ? 0.08 * Math.exp(-Math.pow(x - 0.1, 2) / 0.03) : 0;
    const s = y < 0 ? 1 + 0.66 * y : 1 + 0.08 * y;
    x *= s * 0.98; z = (z - groove) * s * 0.84;
    x -= 0.38 * Math.pow(Math.max(0, -y), 1.5);
    y *= 1.22;
    const n = 0.035 * Math.sin(x * 5 + y * 3) + 0.03 * Math.sin(z * 6 - y * 4) + 0.015 * Math.sin(x * 14 + z * 12);
    return new THREE.Vector3(x * (1 + n), y, z * (1 + n));
  }

  function blob(radius, pos, sx, sy, sz) {
    const g = new THREE.SphereGeometry(radius, 56, 40);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const n = 1 + 0.07 * Math.sin(p.getX(i) * 9 + p.getY(i) * 5) + 0.05 * Math.sin(p.getZ(i) * 8);
      p.setXYZ(i, p.getX(i) * n * sx, p.getY(i) * n * sy, p.getZ(i) * n * sz);
    }
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ map: tex, bumpMap: tex, bumpScale: 0.6, roughness: 0.4, clearcoat: 0.8, clearcoatRoughness: 0.25 }));
    m.position.copy(pos); return m;
  }

  function tube(points, r, color, taper) {
    const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
    const g = new THREE.TubeGeometry(curve, 80, r, 24, false);
    return new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color, roughness: 0.38, clearcoat: 0.9, clearcoatRoughness: 0.25 }));
  }

  const heart = new THREE.Group();

  // Ventricles
  const bodyGeo = new THREE.SphereGeometry(1, 140, 100);
  const pos = bodyGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const d = deform(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)));
    pos.setXYZ(i, d.x, d.y, d.z);
  }
  bodyGeo.computeVertexNormals();
  heart.add(new THREE.Mesh(bodyGeo, new THREE.MeshPhysicalMaterial({ map: tex, bumpMap: tex, bumpScale: 0.7, roughness: 0.34, clearcoat: 1, clearcoatRoughness: 0.18 })));

  // Atria
  heart.add(blob(0.52, new THREE.Vector3(-0.72, 0.7, -0.1), 1, 1.05, 0.95));
  heart.add(blob(0.3, new THREE.Vector3(0.66, 0.95, 0.4), 1, 0.8, 0.8));

  // Great vessels (thicker, closer to the reference)
  const art = 0xa3322c, vein = 0x7a4a6e, pulm = 0x9a4f66;
  heart.add(tube([[0.12,0.8,0.05],[0.15,1.35,0],[0.08,1.8,-0.05],[-0.25,2.05,-0.15],[-0.6,1.75,-0.2],[-0.68,1.1,-0.3]], 0.27, art));
  heart.add(tube([[0.05,1.9,-0.08],[0.1,2.5,-0.08]], 0.1, art));
  heart.add(tube([[-0.28,2.05,-0.15],[-0.36,2.55,-0.15]], 0.095, art));
  heart.add(tube([[0.45,0.8,0.48],[0.55,1.25,0.45],[0.7,1.65,0.32],[1.0,1.75,0.05]], 0.23, pulm));
  heart.add(tube([[-0.68,1.0,0],[-0.74,1.65,-0.1],[-0.7,2.3,-0.1]], 0.19, vein));
  heart.add(tube([[-0.55,-0.2,-0.05],[-0.68,-0.85,-0.05],[-0.78,-1.4,-0.05]], 0.18, vein));

  // Coronary vessels on the surface
  function surf(lat0, lat1, lon0, lon1, r, color) {
    const pts = [];
    for (let i = 0; i <= 26; i++) {
      const t = i / 26, lat = lat0 + (lat1 - lat0) * t, lon = lon0 + (lon1 - lon0) * t;
      const u = new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
      pts.push(deform(u).multiplyScalar(1.012).toArray());
    }
    heart.add(tube(pts, r, color));
  }
  surf(0.6, -0.9, 0.75, 0.35, 0.032, 0x5a0a10);
  surf(0.5, -0.5, 0.65, 0.45, 0.024, 0x4a3a78);
  surf(0.45, -0.3, -0.2, -1.1, 0.032, 0x5a0a10);
  surf(0.5, 0.3, 0.9, 2.2, 0.03, 0x5a0a10);
  surf(0.2, -0.6, -1.3, -0.5, 0.024, 0x4a3a78);

  // Tilt like the reference (apex pointing down-left)
  const tilt = new THREE.Group();
  heart.position.y = -0.45;
  tilt.rotation.z = -0.22; tilt.rotation.x = 0.1;
  tilt.add(heart);

  const beat = new THREE.Group(); beat.add(tilt);
  const spin = new THREE.Group(); spin.add(beat); scene.add(spin);

  // Optional: use the real model if "heart.glb" sits next to this file
  if (THREE.GLTFLoader) {
    new THREE.GLTFLoader().load("heart.glb", gltf => {
      const m = gltf.scene;
      const b = new THREE.Box3().setFromObject(m), size = b.getSize(new THREE.Vector3()), ctr = b.getCenter(new THREE.Vector3());
      const k = 3.8 / Math.max(size.x, size.y, size.z);
      m.scale.setScalar(k); m.position.sub(ctr.multiplyScalar(k));
      beat.remove(tilt); beat.add(m);
    }, undefined, () => {});
  }

  function resize() {
    const w = box.clientWidth, h = box.clientHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(box); resize();

  let drag = false, lastX = 0, extra = 0;
  box.addEventListener("pointerdown", e => { drag = true; lastX = e.clientX; });
  addEventListener("pointerup", () => drag = false);
  addEventListener("pointermove", e => { if (drag) { extra += (e.clientX - lastX) * 0.01; lastX = e.clientX; } });

  const clock = new THREE.Clock();
  (function loop() {
    const t = clock.getElapsedTime();
    spin.rotation.y = t * 0.7 + extra;
    spin.position.y = Math.sin(t * 1.2) * 0.1;
    const p = Math.pow(Math.max(0, Math.sin(t * 6)), 4) * 0.045 + Math.pow(Math.max(0, Math.sin(t * 6 - 1.2)), 4) * 0.028;
    beat.scale.setScalar(1 + p);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
const T = {
  en: {
    dir:"ltr", lang:"العربية", add:"Add content", clear:"Clear content", brand:"Training 2026", hero:"CSS Animation",
    footer:"© 2026 Training 2026. All rights reserved.",
    menu:["Dashboard","HTML Editor","CSS Styles","JS Console","Components","Templates","Snippets","Projects","Live Preview","Responsive Design","Color Palette","Typography","Animations","Debugger","Settings"],
    title:"HTML, CSS & JavaScript",
    intro:"The web platform is built on three complementary technologies. Each has a distinct job, and together they form every page you browse.",
    items:[
      ["HTML","b-html","HTML","HTML (HyperText Markup Language) provides the structure of a page: headings, paragraphs, links, images, and forms. It gives the browser a document to render and gives assistive tools something meaningful to read."],
      ["CSS","b-css","CSS","CSS (Cascading Style Sheets) controls presentation: layout, color, spacing, typography, and responsiveness. It lets the same HTML adapt to different screen sizes and themes without changing the markup."],
      ["JavaScript","b-js","JS","JavaScript adds behavior: it responds to clicks, updates the page without reloading, talks to servers, and builds interactive experiences."]
    ],
    extra:"New section added. You can put any extra content here."
  },
  ar: {
    dir:"rtl", lang:"English", add:"إضافة محتوى", clear:"مسح المحتوى", brand:"تدريب 2026", hero:"حركات CSS",
    footer:"© 2026 تدريب 2026. جميع الحقوق محفوظة.",
    menu:["لوحة التحكم","محرر HTML","تنسيقات CSS","وحدة JS","المكونات","القوالب","المقتطفات","المشاريع","معاينة مباشرة","التصميم المتجاوب","لوحة الألوان","الخطوط","الحركات","المصحح","الإعدادات"],
    title:"HTML و CSS و JavaScript",
    intro:"تُبنى منصة الويب على ثلاث تقنيات متكاملة، لكل منها دور مختلف، وتشكّل معًا كل صفحة تتصفحها.",
    items:[
      ["HTML","b-html","HTML","تقدّم HTML بنية الصفحة: العناوين والفقرات والروابط والصور والنماذج، وتمنح المتصفح مستندًا لعرضه."],
      ["CSS","b-css","CSS","تتحكم CSS بالمظهر: التخطيط والألوان والمسافات والخطوط والتجاوب مع مختلف الشاشات."],
      ["JavaScript","b-js","JS","تضيف JavaScript السلوك: تستجيب للنقرات، وتحدّث الصفحة دون إعادة تحميل، وتبني تجارب تفاعلية."]
    ],
    extra:"تمت إضافة قسم جديد. يمكنك وضع أي محتوى إضافي هنا."
  }
};
const icons = [["▦","#3b6fd4"],["‹›","#1aa37a"],["✎","#e8a317"],[">_","#d4437a"],["❐","#3b6fd4"],["▤","#1aa37a"],["▮","#e8a317"],["▭","#d4437a"],["◉","#3b6fd4"],["▭","#1aa37a"],["◐","#e8a317"],["Aa","#d4437a"],["◎","#3b6fd4"],["✱","#1aa37a"],["☀","#e8a317"]];
let cur = "en";

function render() {
  const t = T[cur];
  document.documentElement.dir = t.dir;
  document.documentElement.lang = cur;
  document.querySelector("#langBtn span").textContent = t.lang;
  document.getElementById("addTxt").textContent = t.add;
  document.getElementById("clearTxt").textContent = t.clear;
  document.getElementById("brand").textContent = t.brand;
  document.getElementById("heroTitle").textContent = t.hero;
  document.getElementById("footer").textContent = t.footer;
  document.getElementById("menu").innerHTML = t.menu.map((m,i)=>`<a href="#"><i style="color:${icons[i][1]}">${icons[i][0]}</i><span>${m}</span></a>`).join("");
  fillContent();
}
function fillContent() {
  const t = T[cur];
  document.getElementById("content").innerHTML =
    `<h1>${t.title}</h1><p>${t.intro}</p>` +
    t.items.map(([h,c,b,p]) => `<h3>${h}</h3><div class="row"><div class="badge ${c}">${b}</div><span>${p}</span></div>`).join("");
}
document.getElementById("langBtn").onclick = () => { cur = cur === "en" ? "ar" : "en"; render(); };
function addContent() {
  const d = document.createElement("div");
  d.className = "new";
  d.innerHTML = `<h3>${T[cur].extra.split(".")[0]}</h3><p>${T[cur].extra}</p>`;
  document.getElementById("content").appendChild(d);
  d.scrollIntoView({behavior:"smooth", block:"center"});
}
document.getElementById("addBtn").onclick = addContent;
document.getElementById("fab").onclick = addContent;
document.getElementById("clearBtn").onclick = () => { document.getElementById("content").innerHTML = ""; };
render();
</script>
</body>
</html>
